"[package]\nname = \"bevy_ui\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"A custom ECS-driven UI framework built specifically for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[dependencies]\n# bevy\nbevy_a11y = { path = \"../bevy_a11y\", version = \"0.19.0-dev\" }\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\" }\nbevy_camera = { path = \"../bevy_camera\", version = \"0.19.0-dev\" }\nbevy_color = { path = \"../bevy_color\", version = \"0.19.0-dev\" }\nbevy_derive = { path = \"../bevy_derive\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\nbevy_image = { path = \"../bevy_image\", version = \"0.19.0-dev\" }\nbevy_input = { path = \"../bevy_input\", version = \"0.19.0-dev\" }\nbevy_input_focus = { path = \"../bevy_input_focus\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\" }\nbevy_log = { path = \"../bevy_log\", version = \"0.19.0-dev\" }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\" }\nbevy_sprite = { path = \"../bevy_sprite\", version = \"0.19.0-dev\", features = [\n  \"bevy_text\",\n] }\nbevy_time = { path = \"../bevy_time\", version = \"0.19.0-dev\" }\nbevy_text = { path = \"../bevy_text\", version = \"0.19.0-dev\" }\nbevy_picking = { path = \"../bevy_picking\", version = \"0.19.0-dev\", optional = true }\nbevy_transform = { path = \"../bevy_transform\", version = \"0.19.0-dev\" }\nbevy_window = { path = \"../bevy_window\", version = \"0.19.0-dev\" }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"std\",\n] }\n\n# other\ntaffy = { version = \"0.10\", default-features = false, features = [\n  \"std\",\n  \"block_layout\",\n  \"flexbox\",\n  \"grid\",\n  \"content_size\",\n  \"taffy_tree\",\n] }\nserde = { version = \"1\", features = [\"derive\"], optional = true }\nuuid = { version = \"1.21.0\", features = [\"v4\"], optional = true }\nthiserror = { version = \"2\", default-features = false }\nderive_more = { version = \"2\", default-features = false, features = [\"from\"] }\nsmallvec = { version = \"1\", default-features = false }\naccesskit = \"0.24\"\nparley = { version = \"0.9.0\", default-features = false, features = [\"std\"] }\nswash = { version = \"0.2.6\" }\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\n\n[dev-dependencies]\nbevy_core_pipeline = { path = \"../bevy_core_pipeline\", version = \"0.19.0-dev\" }\n\n[features]\ndefault = []\nserialize = [\n  \"serde\",\n  \"smallvec/serde\",\n  \"bevy_math/serialize\",\n  \"bevy_platform/serialize\",\n]\nbevy_picking = [\"dep:bevy_picking\", \"dep:uuid\"]\n\n# Experimental features\nghost_nodes = []\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"

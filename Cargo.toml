[package]
name = "bevy_ui"
version = "0.19.0-dev"
publish = false
edition = "2024"
description = "A custom ECS-driven UI framework built specifically for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_a11y = { path = "../bevy_a11y", version = "0.19.0-dev" }
bevy_app = { path = "../bevy_app", version = "0.19.0-dev" }
bevy_asset = { path = "../bevy_asset", version = "0.19.0-dev" }
bevy_camera = { path = "../bevy_camera", version = "0.19.0-dev" }
bevy_color = { path = "../bevy_color", version = "0.19.0-dev" }
bevy_derive = { path = "../bevy_derive", version = "0.19.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0-dev" }
bevy_image = { path = "../bevy_image", version = "0.19.0-dev" }
bevy_input = { path = "../bevy_input", version = "0.19.0-dev" }
bevy_input_focus = { path = "../bevy_input_focus", version = "0.19.0-dev" }
bevy_math = { path = "../bevy_math", version = "0.19.0-dev" }
bevy_log = { path = "../bevy_log", version = "0.19.0-dev" }
bevy_reflect = { path = "../bevy_reflect", version = "0.19.0-dev" }
bevy_sprite = { path = "../bevy_sprite", version = "0.19.0-dev", features = [
  "bevy_text",
] }
bevy_time = { path = "../bevy_time", version = "0.19.0-dev" }
bevy_text = { path = "../bevy_text", version = "0.19.0-dev" }
bevy_picking = { path = "../bevy_picking", version = "0.19.0-dev", optional = true }
bevy_transform = { path = "../bevy_transform", version = "0.19.0-dev" }
bevy_window = { path = "../bevy_window", version = "0.19.0-dev" }
bevy_utils = { path = "../bevy_utils", version = "0.19.0-dev" }
bevy_platform = { path = "../bevy_platform", version = "0.19.0-dev", default-features = false, features = [
  "std",
] }

# other
taffy = { version = "0.10", default-features = false, features = [
  "std",
  "block_layout",
  "flexbox",
  "grid",
  "content_size",
  "taffy_tree",
] }
serde = { version = "1", features = ["derive"], optional = true }
uuid = { version = "1.21.0", features = ["v4"], optional = true }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
smallvec = { version = "1", default-features = false }
accesskit = "0.24"
parley = { version = "0.9.0", default-features = false, features = ["std"] }
swash = { version = "0.2.6" }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.19.0-dev" }

[features]
default = []
serialize = [
  "serde",
  "smallvec/serde",
  "bevy_math/serialize",
  "bevy_platform/serialize",
]
bevy_picking = ["dep:bevy_picking", "dep:uuid"]

# Experimental features
ghost_nodes = []

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
too_long_first_doc_paragraph = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"


[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

